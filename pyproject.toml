[project]
name = "myapi"
dynamic = ["version"]
description = "A standard API"
authors = [{name = "Pablo Rodriguez Mira"}]
requires-python = ">=3.14"
classifiers = ["Programming Language :: Python :: 3.14"]
readme = "README.md"

[project.scripts]
myapi = "myapi.main:main"

[build-system]
requires = ["setuptools", "setuptools-scm[simple]"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
myapi = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
version_file = "src/myapi/_version.py"

[tool.coverage.run]
source = ["myapi"]
omit = ["**/myapi/_version.py"]

[tool.coverage.report]
include_namespace_packages = true

[project.urls]
homepage = "https://github.com/PabloRMira/structure-is-all-you-need"
repository = "https://github.com/PabloRMira/structure-is-all-you-need"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["src/**/*.py"]
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = [".claude"]  # skill docs; snippets are illustrative, not source

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RET", "ARG", "TID", "RUF", "D",
]
# Docstrings are optional; enforce google style only on the ones that exist.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
