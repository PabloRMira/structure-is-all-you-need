name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm needs full history/tags for versioning

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          environments: default
          cache: true

      - name: Run pre-commit hooks
        run: pixi run pre-commit-run

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm needs full history/tags for versioning

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          environments: default
          cache: true

      - name: Run tests
        run: pixi run pytest
