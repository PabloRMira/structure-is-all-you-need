[workspace]
name = "myapi"
authors = ["Pablo Rodriguez Mira"]
platforms = ["win-64", "linux-64"]
exclude-newer = "7d"

[dependencies]
python = "3.14.*"
pip = "*"
fastapi = "*"
loguru = "*"
pydantic = "*"
typer = "*"
uvicorn = "*"

[feature.myapi-dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-html = "*"
ruff = "*"
mypy = "*"
bandit = "*"
pre-commit = "*"
pre-commit-hooks = "*"

[environments]
myapi-prod = { features = [], solve-group = "prod-group" }
default = { features = ["myapi-dev"], solve-group = "prod-group" }

[tasks]
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run -a --color=always"
ptu = "pytest tests/unit"
pti = "pytest tests/integration"
pte = "pytest tests/end2end"
